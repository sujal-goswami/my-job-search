name: Weekly Job Digest

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 0'   # Sunday 9:00am IST (03:30 UTC)

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install openpyxl

      - name: Install LinkedIn CLI deps
        run: bun install --cwd .agents/skills/linkedin-search/cli

      - name: Install freehire CLI deps
        run: bun install --cwd .agents/skills/freehire-search/cli

      # ── LinkedIn searches ──────────────────────────────────────────────────

      - name: LinkedIn - DevOps Kubernetes India
        env:
          LI_AT: ${{ secrets.LI_AT }}
        run: bun run .agents/skills/linkedin-search/cli/src/cli.ts search -q "DevOps Engineer Kubernetes" -l "India" --jobage 7 --limit 25 --format json > /tmp/li_1.json 2>/dev/null || echo "[]" > /tmp/li_1.json

      - name: LinkedIn - AI Infrastructure Engineer India
        env:
          LI_AT: ${{ secrets.LI_AT }}
        run: bun run .agents/skills/linkedin-search/cli/src/cli.ts search -q "AI Infrastructure Engineer" -l "India" --jobage 7 --limit 25 --format json > /tmp/li_2.json 2>/dev/null || echo "[]" > /tmp/li_2.json

      - name: LinkedIn - Platform Engineer AWS India
        env:
          LI_AT: ${{ secrets.LI_AT }}
        run: bun run .agents/skills/linkedin-search/cli/src/cli.ts search -q "Platform Engineer AWS" -l "India" --jobage 7 --limit 25 --format json > /tmp/li_3.json 2>/dev/null || echo "[]" > /tmp/li_3.json

      - name: LinkedIn - MLOps LLM Platform India
        env:
          LI_AT: ${{ secrets.LI_AT }}
        run: bun run .agents/skills/linkedin-search/cli/src/cli.ts search -q "MLOps LLM Platform Engineer" -l "India" --jobage 7 --limit 25 --format json > /tmp/li_4.json 2>/dev/null || echo "[]" > /tmp/li_4.json

      - name: LinkedIn - SRE Kubernetes India
        env:
          LI_AT: ${{ secrets.LI_AT }}
        run: bun run .agents/skills/linkedin-search/cli/src/cli.ts search -q "Site Reliability Engineer Kubernetes" -l "India" --jobage 7 --limit 25 --format json > /tmp/li_5.json 2>/dev/null || echo "[]" > /tmp/li_5.json

      - name: LinkedIn - Remote AI DevOps
        env:
          LI_AT: ${{ secrets.LI_AT }}
        run: bun run .agents/skills/linkedin-search/cli/src/cli.ts search -q "AI Infrastructure DevOps remote" -l "" --jobage 7 --limit 20 --format json > /tmp/li_6.json 2>/dev/null || echo "[]" > /tmp/li_6.json

      - name: LinkedIn - DevSecOps India
        env:
          LI_AT: ${{ secrets.LI_AT }}
        run: bun run .agents/skills/linkedin-search/cli/src/cli.ts search -q "DevSecOps Engineer India" -l "India" --jobage 7 --limit 20 --format json > /tmp/li_7.json 2>/dev/null || echo "[]" > /tmp/li_7.json

      - name: LinkedIn - Cloud Engineer Terraform India
        env:
          LI_AT: ${{ secrets.LI_AT }}
        run: bun run .agents/skills/linkedin-search/cli/src/cli.ts search -q "Cloud Engineer Terraform AWS" -l "India" --jobage 7 --limit 20 --format json > /tmp/li_8.json 2>/dev/null || echo "[]" > /tmp/li_8.json

      # ── freehire searches ──────────────────────────────────────────────────

      - name: freehire - DevOps Kubernetes
        run: bun run .agents/skills/freehire-search/cli/src/cli.ts search -q "devops kubernetes" --jobage 7 --limit 25 --format json > /tmp/fh_1.json 2>/dev/null || echo "[]" > /tmp/fh_1.json

      - name: freehire - AI Infrastructure LLM
        run: bun run .agents/skills/freehire-search/cli/src/cli.ts search -q "ai infrastructure llm platform" --jobage 7 --limit 25 --format json > /tmp/fh_2.json 2>/dev/null || echo "[]" > /tmp/fh_2.json

      - name: freehire - SRE Platform
        run: bun run .agents/skills/freehire-search/cli/src/cli.ts search -q "site reliability engineer platform" --jobage 7 --limit 25 --format json > /tmp/fh_3.json 2>/dev/null || echo "[]" > /tmp/fh_3.json

      - name: freehire - MLOps Cloud Native
        run: bun run .agents/skills/freehire-search/cli/src/cli.ts search -q "mlops cloud native engineer" --jobage 7 --limit 20 --format json > /tmp/fh_4.json 2>/dev/null || echo "[]" > /tmp/fh_4.json

      # ── target company career page scraping ───────────────────────────────

      - name: Scrape target company career pages
        run: python3 tools/scrape_companies.py > /tmp/company_careers.json

      # ── merge all results ──────────────────────────────────────────────────

      - name: Merge and deduplicate
        run: |
          python3 tools/merge_scrape_results.py \
            /tmp/li_1.json:linkedin-search \
            /tmp/li_2.json:linkedin-search \
            /tmp/li_3.json:linkedin-search \
            /tmp/li_4.json:linkedin-search \
            /tmp/li_5.json:linkedin-search \
            /tmp/li_6.json:linkedin-search \
            /tmp/li_7.json:linkedin-search \
            /tmp/li_8.json:linkedin-search \
            /tmp/fh_1.json:freehire-search \
            /tmp/fh_2.json:freehire-search \
            /tmp/fh_3.json:freehire-search \
            /tmp/fh_4.json:freehire-search \
            /tmp/company_careers.json:company-careers \
            --out /tmp/scrape_results.json

      - name: Upload scrape results artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrape-results
          path: /tmp/scrape_results.json
          retention-days: 14

      # ── build digest and send email ────────────────────────────────────────

      - name: Send weekly digest email
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_EMAIL_FROM:  ${{ secrets.DIGEST_EMAIL_FROM }}
          DIGEST_EMAIL_TO:    ${{ secrets.DIGEST_EMAIL_TO }}
        run: python3 tools/weekly_digest.py --input /tmp/scrape_results.json

      # ── job summary ────────────────────────────────────────────────────────

      - name: Job summary
        run: |
          COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/scrape_results.json'))))")
          echo "## Weekly Digest Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Jobs found | $COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Run at | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Digest email sent. To sync locally:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "python3 tools/linkedin_sync.py" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
