name: Weekly Job Digest

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 0'   # Sunday 9:00am IST (03:30 UTC)

permissions:
  contents: read
  actions: read   # read the previous run's seen-jobs artifact

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install openpyxl

      - name: Install LinkedIn CLI deps
        run: bun install --cwd .agents/skills/linkedin-search/cli

      - name: Install freehire CLI deps
        run: bun install --cwd .agents/skills/freehire-search/cli

      # -- LinkedIn searches --

      - name: LinkedIn - DevOps Kubernetes India
        env:
          LI_AT: ${{ secrets.LI_AT }}
        run: bun run .agents/skills/linkedin-search/cli/src/cli.ts search -q "DevOps Engineer Kubernetes" -l "India" --jobage 7 --limit 25 --format json > /tmp/li_1.json || echo "[]" > /tmp/li_1.json

      - name: LinkedIn - AI Infrastructure Engineer India
        env:
          LI_AT: ${{ secrets.LI_AT }}
        run: bun run .agents/skills/linkedin-search/cli/src/cli.ts search -q "AI Infrastructure Engineer" -l "India" --jobage 7 --limit 25 --format json > /tmp/li_2.json || echo "[]" > /tmp/li_2.json

      - name: LinkedIn - Platform Engineer AWS India
        env:
          LI_AT: ${{ secrets.LI_AT }}
        run: bun run .agents/skills/linkedin-search/cli/src/cli.ts search -q "Platform Engineer AWS" -l "India" --jobage 7 --limit 25 --format json > /tmp/li_3.json || echo "[]" > /tmp/li_3.json

      - name: LinkedIn - MLOps LLM Platform India
        env:
          LI_AT: ${{ secrets.LI_AT }}
        run: bun run .agents/skills/linkedin-search/cli/src/cli.ts search -q "MLOps LLM Platform Engineer" -l "India" --jobage 7 --limit 25 --format json > /tmp/li_4.json || echo "[]" > /tmp/li_4.json

      - name: LinkedIn - SRE Kubernetes India
        env:
          LI_AT: ${{ secrets.LI_AT }}
        run: bun run .agents/skills/linkedin-search/cli/src/cli.ts search -q "Site Reliability Engineer Kubernetes" -l "India" --jobage 7 --limit 25 --format json > /tmp/li_5.json || echo "[]" > /tmp/li_5.json

      - name: LinkedIn - Remote AI DevOps
        env:
          LI_AT: ${{ secrets.LI_AT }}
        run: bun run .agents/skills/linkedin-search/cli/src/cli.ts search -q "AI Infrastructure DevOps remote" -l "" --jobage 7 --limit 20 --format json > /tmp/li_6.json || echo "[]" > /tmp/li_6.json

      - name: LinkedIn - DevSecOps India
        env:
          LI_AT: ${{ secrets.LI_AT }}
        run: bun run .agents/skills/linkedin-search/cli/src/cli.ts search -q "DevSecOps Engineer India" -l "India" --jobage 7 --limit 20 --format json > /tmp/li_7.json || echo "[]" > /tmp/li_7.json

      - name: LinkedIn - Cloud Engineer Terraform India
        env:
          LI_AT: ${{ secrets.LI_AT }}
        run: bun run .agents/skills/linkedin-search/cli/src/cli.ts search -q "Cloud Engineer Terraform AWS" -l "India" --jobage 7 --limit 20 --format json > /tmp/li_8.json || echo "[]" > /tmp/li_8.json

      # -- freehire searches --

      - name: freehire - DevOps Kubernetes
        run: bun run .agents/skills/freehire-search/cli/src/cli.ts search -q "devops kubernetes" --country IN --no-description --jobage 7 --limit 25 --format json > /tmp/fh_1.json || echo "[]" > /tmp/fh_1.json

      - name: freehire - AI Infrastructure LLM
        run: bun run .agents/skills/freehire-search/cli/src/cli.ts search -q "ai infrastructure llm platform" --country IN --no-description --jobage 7 --limit 25 --format json > /tmp/fh_2.json || echo "[]" > /tmp/fh_2.json

      - name: freehire - SRE Platform
        run: bun run .agents/skills/freehire-search/cli/src/cli.ts search -q "site reliability engineer platform" --country IN --no-description --jobage 7 --limit 25 --format json > /tmp/fh_3.json || echo "[]" > /tmp/fh_3.json

      - name: freehire - MLOps Cloud Native
        run: bun run .agents/skills/freehire-search/cli/src/cli.ts search -q "mlops cloud native engineer" --country IN --no-description --jobage 7 --limit 20 --format json > /tmp/fh_4.json || echo "[]" > /tmp/fh_4.json

      # -- target company career page scraping --

      - name: Target companies - public ATS boards
        # Exit 1 means most boards errored; keep whatever came back and let the
        # digest's source-health warning flag it instead of killing the run.
        run: python3 tools/fetch_ats.py --config tools/ats_companies.json --out /tmp/ats.json || test -s /tmp/ats.json || echo "[]" > /tmp/ats.json

      - name: Target companies - career pages without an ATS board
        run: python3 tools/scrape_companies.py > /tmp/company_careers.json || echo "[]" > /tmp/company_careers.json

      # -- merge all results --

      - name: Merge and deduplicate
        run: |
          python3 tools/merge_scrape_results.py \
            /tmp/li_1.json:linkedin-search \
            /tmp/li_2.json:linkedin-search \
            /tmp/li_3.json:linkedin-search \
            /tmp/li_4.json:linkedin-search \
            /tmp/li_5.json:linkedin-search \
            /tmp/li_6.json:linkedin-search \
            /tmp/li_7.json:linkedin-search \
            /tmp/li_8.json:linkedin-search \
            /tmp/fh_1.json:freehire-search \
            /tmp/fh_2.json:freehire-search \
            /tmp/fh_3.json:freehire-search \
            /tmp/fh_4.json:freehire-search \
            /tmp/ats.json:company-ats \
            /tmp/company_careers.json:company-careers \
            --out /tmp/scrape_results.json

      - name: Upload scrape results artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrape-results
          path: /tmp/scrape_results.json
          retention-days: 14

      # -- build digest and send email --

      # URLs already emailed, so each digest only shows postings not sent before.
      # Kept as a 90-day artifact (Actions caches are evicted after 7 idle days,
      # which a weekly schedule would hit) and read back from the last good run.
      - name: Restore seen-jobs state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .digest_state
          RUN_ID=$(gh run list -R "$GITHUB_REPOSITORY" --workflow scrape.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n digest-seen -D .digest_state || echo "No seen-jobs state in run $RUN_ID; starting fresh."
          else
            echo "No previous successful run; starting fresh."
          fi

      - name: Send weekly digest email
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_EMAIL_FROM:  ${{ secrets.DIGEST_EMAIL_FROM }}
          DIGEST_EMAIL_TO:    ${{ secrets.DIGEST_EMAIL_TO }}
        run: python3 tools/weekly_digest.py --input /tmp/scrape_results.json --seen-file .digest_state/seen.json

      - name: Save seen-jobs state
        uses: actions/upload-artifact@v4
        with:
          name: digest-seen
          path: .digest_state/seen.json
          retention-days: 90

      # weekly_digest.py writes the per-source table to the job summary itself.
      - name: Sync hint
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To sync locally: \`python3 tools/linkedin_sync.py\`" >> $GITHUB_STEP_SUMMARY
